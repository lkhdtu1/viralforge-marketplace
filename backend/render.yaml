# Render.com deployment configuration
# Free tier available: https://render.com

services:
  # Backend API
  - type: web
    name: viralforge-api
    env: node
    plan: free # or starter for production
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: viralforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: viralforge-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.com
      - key: FRONTEND_URL
        value: https://your-frontend-domain.com

databases:
  # PostgreSQL Database
  - name: viralforge-db
    plan: free # or starter for production
    databaseName: viralforge
    user: viralforge

  # Redis
  - name: viralforge-redis
    plan: free
    type: redis

